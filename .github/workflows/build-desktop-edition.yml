name: Build desktop edition

on:
  workflow_call:
    inputs:
      edition:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_version:
        required: true
        type: string
      dmg_name:
        required: true
        type: string
      dmg_volume:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      build_windows:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test (${{ inputs.edition }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --concurrency=2

      - name: Test edition build planning
        run: python3 tool/test_desktop_build_plan.py

      - name: Test macOS arm64 packaging
        run: python3 tool/test_macos_arm64.py

      - name: Test git hooks and commit guard
        run: python3 tool/test_git_hooks.py

  # Windows 那半截(剪贴板读写、原生拦 Ctrl+V)在本机没有任何编译机会:
  # Swift 只build macOS,C++ 要 MSVC。这里把 Windows 构建和原生单测都跑起来 ——
  # 少了这一趟,那半边代码就只能等用户实机报错。
  windows:
    name: Build and test Windows (standard)
    needs: quality
    if: inputs.build_windows && inputs.edition == 'standard'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Stage ONNX Runtime from official Microsoft NuGet package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVersion = '1.22.0'
          $expectedSha256 = 'D571E63A2329BAACB713F441E65AD75284DE354DB6E1AC435FE4BEBBB417986A'
          $targetRoot = "build/windows/x64/plugins/flutter_onnxruntime/onnxruntime/onnxruntime-win-x64-$ortVersion"
          $includeDir = Join-Path $targetRoot 'include'
          $libDir = Join-Path $targetRoot 'lib'
          if (Test-Path -LiteralPath (Join-Path $includeDir 'onnxruntime_cxx_api.h')) {
            Write-Host "ONNX Runtime $ortVersion already staged at $targetRoot"
            exit 0
          }
          $nupkg = Join-Path $env:RUNNER_TEMP "microsoft.ml.onnxruntime.$ortVersion.nupkg"
          $extract = Join-Path $env:RUNNER_TEMP "ort-nuget-$ortVersion"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ortVersion/microsoft.ml.onnxruntime.$ortVersion.nupkg"
          Write-Host "Downloading official Microsoft.ML.OnnxRuntime $ortVersion from NuGet..."
          Invoke-WebRequest -Uri $url -OutFile $nupkg
          $actualSha256 = (Get-FileHash -LiteralPath $nupkg -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "NuGet SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }
          if (Test-Path -LiteralPath $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($nupkg, $extract)
          New-Item -ItemType Directory -Path $includeDir, $libDir -Force | Out-Null
          Copy-Item -Path (Join-Path $extract 'build/native/include/*') -Destination $includeDir -Force
          Copy-Item -Path (Join-Path $extract 'runtimes/win-x64/native/*') -Destination $libDir -Force
          $dll = Join-Path $libDir 'onnxruntime.dll'
          $sig = Get-AuthenticodeSignature -LiteralPath $dll
          Write-Host "onnxruntime.dll signature: Status=$($sig.Status), Subject=$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*Microsoft Corporation*') {
            throw "Unexpected Authenticode signature on ${dll}: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          }
          if (!(Test-Path -LiteralPath (Join-Path $includeDir 'onnxruntime_cxx_api.h')) -or
              !(Test-Path -LiteralPath (Join-Path $libDir 'onnxruntime.lib')) -or
              !(Test-Path -LiteralPath $dll)) {
            throw "Staged ONNX Runtime $ortVersion is incomplete in $targetRoot"
          }

      - name: Build release app
        run: flutter build windows --release --no-pub

      - name: Windows package version tests
        shell: pwsh
        run: |
          ./tool/test_windows_package_version.ps1
          ./tool/test_windows_runtime_files.ps1

      - name: Native clipboard and crash diagnostics tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S test/native -B build/native -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ocrTags = @(& "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -Command '
            try {
              $null = [Windows.Media.Ocr.OcrEngine, Windows.Media.Ocr, ContentType=WindowsRuntime]
              [Windows.Media.Ocr.OcrEngine]::AvailableRecognizerLanguages | ForEach-Object { $_.LanguageTag }
            } catch {}
          ') | Where-Object { $_ -and $_.Trim() -ne '' }
          $profileTags = @(& "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -Command '
            try { (Get-WinUserLanguageList) | ForEach-Object { $_.LanguageTag } } catch {}
          ') | Where-Object { $_ -and $_.Trim() -ne '' }
          Write-Host "Available Windows OCR languages: $($ocrTags -join ', ')"
          Write-Host "User profile languages: $($profileTags -join ', ')"
          $exclude = @()
          if (!($ocrTags | Where-Object { $_ -like 'en*' })) {
            $exclude += '^proxy_assist_test$'
          }
          if (!($ocrTags | Where-Object { $_ -like 'zh*' }) -or !($profileTags | Where-Object { $_ -like 'zh*' })) {
            $exclude += '^proxy_assist_chinese_test$'
          }
          $ctestArgs = @('--test-dir', 'build/native', '-C', 'Release', '--output-on-failure')
          if ($exclude.Count -gt 0) {
            Write-Host "Skipping native OCR tests requiring unavailable runner OCR language/profile: $($exclude -join ', ')"
            $ctestArgs += @('-E', ($exclude -join '|'))
          }
          ctest @ctestArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows installer and portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$visualStudio) { throw 'Visual Studio with x64 tools was not found' }
          $crt = Get-ChildItem -Path (Join-Path $visualStudio 'VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT') -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$crt) { throw 'Visual Studio x64 redistributable CRT was not found' }
          # PATH can point to Chocolatey's shim, which has no license file.
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip'
          ./tool/package_windows.ps1 -SkipBuild -OutputDirectory build/windows-packages `
            -SevenZipDirectory $sevenZip -RuntimeDirectory $crt.FullName -IsccPath $iscc

      - name: Verify Windows install, upgrade and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tool/windows_package_version.ps1
          $version = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\S+)').Groups[1].Value
          $packageName = (Get-PlanaWindowsPackageVersion $version).PackageName
          ./tool/test_windows_installation.ps1 `
            -BundleDirectory "build/windows-packages/$packageName" `
            -InstallerPath "build/windows-packages/$packageName-setup.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Plana-App-Desktop-Windows-x64
          path: |
            build/windows-packages/*.zip
            build/windows-packages/*-setup.exe
            build/windows-packages/*.sha256
          if-no-files-found: error

  macos:
    name: Build macOS arm64 (${{ inputs.edition }})
    needs: quality
    env:
      DMG_NAME: ${{ inputs.dmg_name }}
      DMG_VOLUME: ${{ inputs.dmg_volume }}
      PLANA_RELEASE_VERSION: ${{ inputs.release_version }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Test macOS updater native arguments
        run: flutter test --no-pub --reporter expanded test/macos_update_script_test.dart

      - name: Build arm64 release app
        shell: bash
        run: |
          set -euo pipefail
          # Work around download.onnxruntime.ai TLS outage on the unused
          # onnxruntime_extensions target in masicai/onnxruntime-swift-package-manager 1.23.1.
          # flutter_onnxruntime only uses the `onnxruntime` product, whose binary remains
          # fetched from masicai's GitHub release with SwiftPM SHA-256 verification.
          ort_spm_dir="$RUNNER_TEMP/onnxruntime-swift-package-manager"
          ort_spm_commit="57f28b1fdd6fe33585370b146a46c597d6750953"
          plugin_manifest="${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev/flutter_onnxruntime-1.8.4/macos/flutter_onnxruntime/Package.swift"
          plugin_backup="$RUNNER_TEMP/flutter_onnxruntime.Package.swift.bak"
          cp "$plugin_manifest" "$plugin_backup"
          restore_plugin_manifest() {
            cp "$plugin_backup" "$plugin_manifest"
            rm -f "$plugin_backup"
          }
          trap restore_plugin_manifest EXIT

          rm -rf "$ort_spm_dir"
          git clone --branch 1.23.1 --depth 1 \
            https://github.com/masicai/onnxruntime-swift-package-manager.git "$ort_spm_dir"
          actual_commit="$(git -C "$ort_spm_dir" rev-parse HEAD)"
          if [[ "$actual_commit" != "$ort_spm_commit" ]]; then
            echo "::error::Unexpected onnxruntime-swift-package-manager commit: $actual_commit"
            exit 1
          fi

          python3 - "$ort_spm_dir/Package.swift" "$plugin_manifest" "$ort_spm_dir" <<'PY'
          from pathlib import Path
          import sys

          ort_pkg = Path(sys.argv[1])
          plugin_pkg = Path(sys.argv[2])
          local_dir = sys.argv[3]

          src = ort_pkg.read_text(encoding="utf-8")
          removals = [
              '        .library(name: "onnxruntime_extensions",\n'
              '                 type: .static,\n'
              '                 targets: ["OnnxRuntimeExtensions"]),\n',
              '        .target(name: "OnnxRuntimeExtensions",\n'
              '                dependencies: ["onnxruntime_extensions", "onnxruntime"],\n'
              '                path: "extensions",\n'
              '                cxxSettings: [\n'
              '                    .define("ORT_SWIFT_PACKAGE_MANAGER_BUILD"),\n'
              '                ]),\n',
              '        .testTarget(name: "OnnxRuntimeExtensionsTests",\n'
              '                    dependencies: ["OnnxRuntimeExtensions", "OnnxRuntimeBindings"],\n'
              '                    path: "swift/OnnxRuntimeExtensionsTests",\n'
              '                    resources: [\n'
              '                        .copy("Resources/decode_image.onnx")\n'
              '                    ]),\n',
              'if let ext_pod_archive_path = ProcessInfo.processInfo.environment["ORT_EXTENSIONS_POD_LOCAL_PATH"] {\n'
              '    package.targets.append(Target.binaryTarget(name: "onnxruntime_extensions", path: ext_pod_archive_path))\n'
              '} else {\n'
              '    // ORT Extensions release\n'
              '    //\n'
              '    // NOTE: still Microsoft\'s framework-format pod archive, so the App Store\n'
              '    // embedding issue described above applies to apps that consume the\n'
              '    // "onnxruntime_extensions" product. Repackage it the same way if needed\n'
              '    // (flutter_onnxruntime does not use it).\n'
              '    package.targets.append(\n'
              '        Target.binaryTarget(name: "onnxruntime_extensions",\n'
              '                            url: "https://download.onnxruntime.ai/pod-archive-onnxruntime-extensions-c-0.13.0.zip",\n'
              '                            // SHA256 checksum\n'
              '                            checksum: "346522d1171d4c99cb0908fa8e4e9330a4a6aad39cd83ce36eb654437b33e6b5")\n'
              '    )\n'
              '}\n',
          ]
          for snippet in removals:
              assert snippet in src, f"Expected snippet not found in ort Package.swift: {snippet[:60]!r}"
              src = src.replace(snippet, "", 1)
          assert "download.onnxruntime.ai" not in src
          assert "onnxruntime_extensions" not in src
          assert "onnxruntime-libs-1.23.0.zip" in src
          assert "4bd86356e2d5aab1b8ece609bb9caa63161a6d79d21244da007f9fda6830ff3b" in src
          ort_pkg.write_text(src, encoding="utf-8")

          plugin_src = plugin_pkg.read_text(encoding="utf-8")
          old_dep = '.package(url: "https://github.com/masicai/onnxruntime-swift-package-manager", exact: "1.23.1")'
          new_dep = f'.package(path: "{local_dir}")'
          assert old_dep in plugin_src, "Expected masicai SPM dependency line not found in flutter_onnxruntime Package.swift"
          plugin_pkg.write_text(plugin_src.replace(old_dep, new_dep, 1), encoding="utf-8")
          PY

          swift package --package-path "$ort_spm_dir" dump-package >/dev/null
          bash tool/build_macos_arm64.sh

      - name: Validate macOS application
        shell: bash
        run: |
          set -euo pipefail

          app_path="build/macos/Build/Products/Release/Plana App Desktop.app"
          plist_path="$app_path/Contents/Info.plist"
          entitlements_path="$RUNNER_TEMP/plana-release-entitlements.plist"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist_path")"
          executable_path="$app_path/Contents/MacOS/$executable_name"

          # Disk images retain POSIX modes. Keep the bundle usable when the
          # mounted volume's numeric owner differs from the local macOS user.
          chmod -R a+rX "$app_path"

          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              chmod a+x "$candidate"
              architectures="$(lipo -archs "$candidate")"
              echo "$candidate: $architectures"
              test "$architectures" = arm64
            fi
          done < <(find "$app_path" -type f -print0)

          # GitHub-hosted builds have no Developer ID certificate. Release is
          # intentionally non-sandboxed and uses the classic login Keychain,
          # while file_picker requires the user-selected file entitlement even
          # outside the sandbox. Keep that entitlement in the ad-hoc signature.
          codesign --force --sign - \
            --entitlements macos/Runner/Release.entitlements "$app_path"

          test -x "$executable_path"
          test "$executable_name" = "Plana App"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist_path")" = "Plana App Desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist_path")" = "com.sora214.plana.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist_path")" = "14.0"
          expected_version="$(printf '%s' "${PLANA_RELEASE_VERSION%%+*}" | tr -cd '0-9.')"
          expected_build="${PLANA_RELEASE_VERSION##*+}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist_path")" = "$expected_version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist_path")" = "$expected_build"
          printf 'Validated macOS bundle version %s, build %s\n' "$expected_version" "$expected_build"
          codesign --verify --deep --strict --verbose=4 "$app_path"
          codesign --display --entitlements - --xml "$app_path" > "$entitlements_path"
          plutil -lint "$entitlements_path"
          cat "$entitlements_path"

          test "$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.files.user-selected.read-write' \
            "$entitlements_path")" = "true"

          for forbidden_entitlement in \
            com.apple.security.get-task-allow \
            com.apple.security.app-sandbox; do
            entitlement_value="$(
              /usr/libexec/PlistBuddy \
                -c "Print :$forbidden_entitlement" \
                "$entitlements_path" 2>/dev/null || true
            )"
            if [[ "$entitlement_value" == "true" ]]; then
              echo "::error::Ad-hoc signature contains $forbidden_entitlement=true"
              exit 1
            fi
          done

          keychain_smoke_log="$RUNNER_TEMP/plana-keychain-smoke.log"
          PLANA_MACOS_KEYCHAIN_SMOKE_TEST=1 \
            "$executable_path" >"$keychain_smoke_log" 2>&1 &
          keychain_smoke_pid=$!
          (
            sleep 20
            kill -TERM "$keychain_smoke_pid" 2>/dev/null || true
          ) &
          keychain_watchdog_pid=$!

          keychain_smoke_status=0
          wait "$keychain_smoke_pid" || keychain_smoke_status=$?
          kill "$keychain_watchdog_pid" 2>/dev/null || true
          wait "$keychain_watchdog_pid" 2>/dev/null || true
          cat "$keychain_smoke_log"
          if [[ "$keychain_smoke_status" -ne 0 ]]; then
            echo "::error::macOS Keychain smoke test failed with status $keychain_smoke_status"
            exit 1
          fi

          # 剪贴板通道同理:Swift 文件漏进工程,构建和启动都不会报错,只有用户
          # 按 ⌘V 才发现。这一步真往系统剪贴板写一张 2×2 的图再读回来。
          clipboard_smoke_log="$RUNNER_TEMP/plana-clipboard-smoke.log"
          PLANA_MACOS_CLIPBOARD_SMOKE_TEST=1 \
            "$executable_path" >"$clipboard_smoke_log" 2>&1 &
          clipboard_smoke_pid=$!
          (
            sleep 20
            kill -TERM "$clipboard_smoke_pid" 2>/dev/null || true
          ) &
          clipboard_watchdog_pid=$!

          clipboard_smoke_status=0
          wait "$clipboard_smoke_pid" || clipboard_smoke_status=$?
          kill "$clipboard_watchdog_pid" 2>/dev/null || true
          wait "$clipboard_watchdog_pid" 2>/dev/null || true
          cat "$clipboard_smoke_log"
          if [[ "$clipboard_smoke_status" -ne 0 ]]; then
            echo "::error::macOS clipboard smoke test failed with status $clipboard_smoke_status"
            exit 1
          fi

      - name: Create ad-hoc DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_root="$RUNNER_TEMP/plana-dmg-root"
          mkdir -p "$dmg_root"
          ditto "build/macos/Build/Products/Release/Plana App Desktop.app" \
            "$dmg_root/Plana App Desktop.app"
          # Existing clients locate this exact path inside a DMG. The hidden
          # link lets their updater copy the renamed bundle without a reinstall.
          ln -s "Plana App Desktop.app" "$dmg_root/Plana App.app"
          chflags -h hidden "$dmg_root/Plana App.app"
          hdiutil create -volname "$DMG_VOLUME" -srcfolder "$dmg_root" \
            -ov -format UDZO "$DMG_NAME"

      - name: Create update checksum
        run: shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"

      - name: Validate packaged macOS image
        shell: bash
        run: |
          set -euo pipefail

          mount_point="$(mktemp -d)"
          smoke_log="$RUNNER_TEMP/plana-macos-smoke.log"
          cleanup() {
            hdiutil detach "$mount_point" || true
            rmdir "$mount_point" || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$DMG_NAME"
          app_path="$mount_point/Plana App Desktop.app"
          plist_path="$app_path/Contents/Info.plist"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist_path")"
          executable_path="$app_path/Contents/MacOS/$executable_name"

          test -x "$executable_path"
          file "$executable_path"
          bash tool/verify_macos_arm64.sh "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"

          # Verify the legacy updater's ditto operation follows the hidden link
          # and produces a complete bundle, with its original executable name.
          test -L "$mount_point/Plana App.app"
          legacy_copy="$RUNNER_TEMP/plana-legacy-update.app"
          ditto "$mount_point/Plana App.app" "$legacy_copy"
          test -d "$legacy_copy"
          test ! -L "$legacy_copy"
          test -x "$legacy_copy/Contents/MacOS/Plana App"
          codesign --verify --deep --strict --verbose=4 "$legacy_copy"

          open -n -W -g "$app_path" >"$smoke_log" 2>&1 &
          open_pid=$!
          sleep 8
          if ! kill -0 "$open_pid" 2>/dev/null; then
            cat "$smoke_log"
            log show --last 2m --style compact \
              --predicate 'process == "Plana App" OR eventMessage CONTAINS[c] "com.sora214.plana.app"' \
              | tail -200 || true
            exit 1
          fi

          app_pid="$(pgrep -x "$executable_name" | head -1)"
          test -n "$app_pid"
          kill "$app_pid"
          for _ in {1..20}; do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          kill -9 "$app_pid" 2>/dev/null || true
          wait "$open_pid" || true

      - name: Upload macOS image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ inputs.dmg_name }}
            ${{ inputs.dmg_name }}.sha256
          if-no-files-found: error
