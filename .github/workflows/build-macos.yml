name: Build desktop

on:
  workflow_dispatch:
    inputs:
      editions:
        description: macOS editions to build (release builds use both)
        type: choice
        options: [both, standard, remote-upload]
        default: both
      standard_ref:
        description: Standard edition branch
        default: desktop/merge-windows45
        type: string
      remote_ref:
        description: Remote upload edition branch
        default: feature/remote-upload
        type: string
      build_windows:
        description: Also build the standard Windows edition
        type: boolean
        default: true
  push:
    branches:
      - 'desktop/**'
      - 'feature/remote-upload'
    tags:
      - 'v*-desktop*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve edition commits
    runs-on: ubuntu-latest
    outputs:
      standard: ${{ steps.plan.outputs.standard }}
      remote_upload: ${{ steps.plan.outputs.remote_upload }}
      remote_sha: ${{ steps.plan.outputs.remote_sha }}
      standard_sha: ${{ steps.plan.outputs.standard_sha }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
    steps:
      - uses: actions/checkout@v7
      - name: Pin commits and validate matching versions
        id: plan
        env:
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_EDITIONS: ${{ inputs.editions || 'both' }}
          STANDARD_BRANCH: ${{ inputs.standard_ref || 'desktop/merge-windows45' }}
          REMOTE_BRANCH: ${{ inputs.remote_ref || 'feature/remote-upload' }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
        run: python3 tool/desktop_build_plan.py
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-build-plan
          path: desktop-build-plan.json

  standard:
    name: Standard edition
    needs: plan
    if: needs.plan.outputs.standard_sha != ''
    uses: ./.github/workflows/build-desktop-edition.yml
    with:
      edition: standard
      source_sha: ${{ fromJson(needs.plan.outputs.standard).sha }}
      release_version: ${{ fromJson(needs.plan.outputs.standard).version }}
      dmg_name: ${{ fromJson(needs.plan.outputs.standard).dmg }}
      dmg_volume: ${{ fromJson(needs.plan.outputs.standard).volume }}
      artifact_name: ${{ fromJson(needs.plan.outputs.standard).artifact }}
      build_windows: ${{ needs.plan.outputs.build_windows == 'true' }}

  remote_upload:
    name: Remote upload edition
    needs: plan
    if: needs.plan.outputs.remote_sha != ''
    uses: ./.github/workflows/build-desktop-edition.yml
    with:
      edition: remoteUpload
      source_sha: ${{ fromJson(needs.plan.outputs.remote_upload).sha }}
      release_version: ${{ fromJson(needs.plan.outputs.remote_upload).version }}
      dmg_name: ${{ fromJson(needs.plan.outputs.remote_upload).dmg }}
      dmg_volume: ${{ fromJson(needs.plan.outputs.remote_upload).volume }}
      artifact_name: ${{ fromJson(needs.plan.outputs.remote_upload).artifact }}
